name: Publish treeqt-bin to AUR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

jobs:
  aur:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout public TreeQt repository
        uses: actions/checkout@v4

      - name: Detect AUR credentials
        id: gate
        shell: bash
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publication."
          fi

      - name: Configure AUR SSH access
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -t ed25519 aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Publish AUR recipe
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          git clone ssh://aur@aur.archlinux.org/treeqt-bin.git aur-treeqt-bin
          cp packaging/arch/PKGBUILD aur-treeqt-bin/PKGBUILD
          cp packaging/arch/.SRCINFO aur-treeqt-bin/.SRCINFO
          cp packaging/arch/LICENSE-0BSD aur-treeqt-bin/LICENSE
          cd aur-treeqt-bin
          git config user.name 'ARIMA IMMANUEL'
          git config user.email '35724936+Elmiar0642@users.noreply.github.com'
          git add PKGBUILD .SRCINFO LICENSE
          if git diff --cached --quiet; then
            echo 'AUR package already current.'
            exit 0
          fi
          git commit -m "Update TreeQt binary package"
          git push origin master
